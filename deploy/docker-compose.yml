# Deployment for the control plane on a single VPS that ALREADY runs a host
# nginx + certbot fronting other sites (shared box). Instead of bundling Caddy
# (which would fight the host nginx for :80/:443), we expose the control plane
# only on 127.0.0.1:9000 and let the host nginx vhost terminate TLS and proxy
# to it. The control plane serves both the API and the built React SPA, so the
# nginx vhost is a plain reverse proxy (see deploy/nginx.danelbot.conf).
#
# Topology:
#   internet --443--> host nginx (TLS) --127.0.0.1:9000--> control-plane
#                                                            └─bots─> per-user freqtrade
# Bot containers (launched at runtime via the Docker API) join control-plane-bots
# and publish NO ports, so they are unreachable from the internet.
#
# Path note (docker-out-of-docker): the control plane writes each user's config
# to CP_BOT_DATA_ROOT and asks the HOST Docker daemon to bind-mount that HOST
# path into the bot container, so CP_BOT_DATA_ROOT must be mounted into the
# control plane at the SAME path it has on the host (/srv/control-plane/bots).

services:
  control-plane:
    build:
      # Repo root so the Dockerfile can build the frontend too.
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      CP_DATABASE_URL: sqlite:////data/control_plane.sqlite
      CP_BOT_DATA_ROOT: /srv/control-plane/bots
      CP_BOT_NETWORK: control-plane-bots
      CP_BOT_ADDRESS_MODE: dns
    ports:
      # Localhost-only: reachable by the host nginx, never from the internet.
      - "127.0.0.1:9000:9000"
    volumes:
      # Manage sibling bot containers via the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path on host and in-container so bind mounts resolve correctly.
      - /srv/control-plane/bots:/srv/control-plane/bots
      # Persist the control-plane database.
      - cp_data:/data
    networks:
      - control-plane-bots

networks:
  control-plane-bots:
    # Fixed name (no compose project prefix) so the Docker SDK attaches bot
    # containers to this exact network.
    name: control-plane-bots

volumes:
  cp_data:
