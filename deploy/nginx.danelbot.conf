# Host-nginx vhost for the Freqtrade Control Plane.
# The control plane container publishes 127.0.0.1:9000 and serves BOTH the API
# and the React SPA, so this is a plain reverse proxy (TLS added by certbot).
#
# Install:
#   sudo cp deploy/nginx.danelbot.conf /etc/nginx/sites-available/danelbot.automateca.site
#   sudo ln -s /etc/nginx/sites-available/danelbot.automateca.site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d danelbot.automateca.site   # injects the TLS block

server {
    server_name danelbot.automateca.site;

    # The control plane streams Freqtrade websocket/log data; allow upgrades and
    # generous timeouts so long-lived proxied connections are not cut.
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    listen 80;
}
